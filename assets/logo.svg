<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0F172A"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" stroke="url(#g1)" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- Leaf / health shape - center -->
  <path d="M256 120 C256 120 180 180 180 260 C180 320 216 360 256 380 C296 360 332 320 332 260 C332 180 256 120 256 120Z" fill="url(#g1)" opacity="0.9"/>

  <!-- Leaf vein -->
  <path d="M256 150 L256 360" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M256 200 L228 240" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M256 200 L284 240" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M256 260 L224 300" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M256 260 L288 300" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Circuit / AI nodes - left -->
  <circle cx="140" cy="180" r="12" fill="url(#g2)"/>
  <circle cx="120" cy="260" r="8" fill="url(#g2)" opacity="0.7"/>
  <line x1="140" y1="192" x2="120" y2="252" stroke="#34D399" stroke-width="2" opacity="0.4"/>

  <!-- Circuit / AI nodes - right -->
  <circle cx="372" cy="180" r="12" fill="url(#g2)"/>
  <circle cx="392" cy="260" r="8" fill="url(#g2)" opacity="0.7"/>
  <line x1="372" y1="192" x2="392" y2="252" stroke="#34D399" stroke-width="2" opacity="0.4"/>

  <!-- Connection lines from nodes to leaf -->
  <line x1="152" y1="180" x2="180" y2="230" stroke="#34D399" stroke-width="1.5" opacity="0.3"/>
  <line x1="360" y1="180" x2="332" y2="230" stroke="#34D399" stroke-width="1.5" opacity="0.3"/>

  <!-- Bottom pulse dots -->
  <circle cx="200" cy="400" r="6" fill="url(#g2)" opacity="0.5"/>
  <circle cx="256" cy="410" r="8" fill="url(#g2)" opacity="0.6"/>
  <circle cx="312" cy="400" r="6" fill="url(#g2)" opacity="0.5"/>
  <line x1="206" y1="400" x2="248" y2="408" stroke="#34D399" stroke-width="1.5" opacity="0.3"/>
  <line x1="264" y1="408" x2="306" y2="400" stroke="#34D399" stroke-width="1.5" opacity="0.3"/>
  <line x1="256" y1="380" x2="256" y2="402" stroke="#34D399" stroke-width="1.5" opacity="0.3"/>
</svg>
